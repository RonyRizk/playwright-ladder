name: Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the project
        run: npm ci

      - name: Install the browser the robot will drive
        run: npx playwright install --with-deps chromium

      - name: Run the Playwright tests
        run: npx playwright test

      - name: Keep the report (also when the tests failed)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: e2e
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Tell Render to deploy the new code
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$DEPLOY_HOOK"